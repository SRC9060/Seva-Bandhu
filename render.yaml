services:
  - type: web
    name: seva-bandhu-src9060
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT seva_bandhu.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_CREATE_SUPERUSER
        value: "false"
