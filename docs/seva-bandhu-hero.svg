<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Seva Bandhu platform overview</title><desc id="desc">A stylized illustration of the customer, technician and admin sides of the Seva Bandhu platform.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#123f87"/></linearGradient>
  <linearGradient id="card" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#00102a" flood-opacity=".22"/></filter>
</defs>
<rect width="1400" height="620" rx="36" fill="url(#bg)"/>
<circle cx="1240" cy="100" r="180" fill="#5ea0ff" opacity=".12"/>
<circle cx="110" cy="530" r="220" fill="#5ea0ff" opacity=".08"/>
<text x="90" y="94" fill="#8dbbff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">SEVA BANDHU</text>
<text x="90" y="145" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800">Home services, but built like a real platform.</text>
<text x="90" y="184" fill="#c8d8f5" font-family="Inter,Arial,sans-serif" font-size="20">Booking • Payments • Live Tracking • ML • AI • Wallets • Analytics</text>

<g filter="url(#shadow)">
  <rect x="88" y="245" width="370" height="245" rx="24" fill="url(#card)"/>
  <rect x="515" y="208" width="370" height="282" rx="24" fill="url(#card)"/>
  <rect x="943" y="245" width="370" height="245" rx="24" fill="url(#card)"/>
</g>

<g font-family="Inter,Arial,sans-serif">
  <circle cx="127" cy="285" r="22" fill="#2d68d8"/><text x="165" y="292" fill="#122342" font-size="23" font-weight="800">CUSTOMER</text>
  <text x="126" y="340" fill="#285dba" font-size="18" font-weight="700">Book a service</text>
  <text x="126" y="372" fill="#53627b" font-size="15">Recommendations + smart offers</text>
  <text x="126" y="401" fill="#53627b" font-size="15">Payment + invoice email</text>
  <text x="126" y="430" fill="#53627b" font-size="15">Track technician + chat</text>
  <rect x="126" y="449" width="230" height="7" rx="4" fill="#d6e4fb"/>

  <circle cx="554" cy="248" r="22" fill="#1d8f69"/><text x="592" y="255" fill="#122342" font-size="23" font-weight="800">TECHNICIAN</text>
  <text x="554" y="306" fill="#237d61" font-size="18" font-weight="700">Accept → Start Journey → Complete</text>
  <text x="554" y="338" fill="#53627b" font-size="15">GPS + OSRM route + voice guidance</text>
  <text x="554" y="368" fill="#53627b" font-size="15">Real-time chat over WebSockets</text>
  <text x="554" y="398" fill="#53627b" font-size="15">Wallet + withdrawals + incentives</text>
  <text x="554" y="428" fill="#53627b" font-size="15">Support flow → human admin escalation</text>
  <rect x="554" y="449" width="250" height="7" rx="4" fill="#d4eee4"/>

  <circle cx="982" cy="285" r="22" fill="#7c4fd5"/><text x="1020" y="292" fill="#122342" font-size="23" font-weight="800">SUPER ADMIN</text>
  <text x="982" y="340" fill="#6c43bd" font-size="18" font-weight="700">See the whole system</text>
  <text x="982" y="372" fill="#53627b" font-size="15">Sales / income / wallets / offers</text>
  <text x="982" y="401" fill="#53627b" font-size="15">ML + rating + referral analytics</text>
  <text x="982" y="430" fill="#53627b" font-size="15">Ask data questions in plain English</text>
  <rect x="982" y="449" width="230" height="7" rx="4" fill="#e2d8f5"/>
</g>

<text x="90" y="564" fill="#94b8ef" font-family="Inter,Arial,sans-serif" font-size="15">Django • Channels • PostgreSQL • scikit-learn • Gemini/Groq • Brevo • Leaflet/OSRM • Render • Supabase • Vercel</text>
</svg>